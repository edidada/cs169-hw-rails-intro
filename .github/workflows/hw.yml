name: CS169 hw-rails-intro
on:
  push:
    branches: [edidada/cs169-hw]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rails-intro:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Prepare database
        run: bin/rails db:test:prepare
      - name: Run all official request specs
        run: bundle exec rspec --format documentation
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rails-intro-results
          path: |
            app/controllers/movies_controller.rb
            app/views/movies/index.html.erb
            spec/requests/*.rb
            log/*.log
          if-no-files-found: warn
